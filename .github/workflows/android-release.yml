name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag versi rilis (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets signing rilis belum lengkap! Harap tambahkan KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, dan KEY_PASSWORD di Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/jalanislam-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: signing/jalanislam-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore from runner
        if: always()
        run: rm -rf signing

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Jalan Islam ${{ steps.meta.outputs.tag }} — Rilis Stabil
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Jalan Islam ${{ steps.meta.outputs.tag }} (Rilis Stabil)

            Aplikasi Android pendamping ibadah harian lengkap untuk Muslim dengan perhitungan waktu sholat astronomis presisi, alarm adzan andal, dan Al-Qur'an Digital 114 Surah.

            ### Fitur Utama
            - **Jadwal Sholat & Imsak Presisi (Kemenag RI)**: Deteksi lokasi GPS otomatis/manual dengan sinkronisasi penuh, jadwal 30 hari, dan koreksi menit manual.
            - **Alarm Adzan Layar Mati & Modal Penghenti**: Dukungan `USE_FULL_SCREEN_INTENT` & WakeLock untuk Android 14 / HyperOS, pilihan audio adzan per waktu sholat atau audio lokal HP, serta modal pop-up besar 1-klik hentikan adzan + bacaan Doa Setelah Adzan.
            - **Al-Qur'an Digital 114 Surah**: Teks Arab Rasm Utsmani, Latin & terjemahan resmi Kemenag RI (termasuk cache offline otomatis), audio murottal per ayat, tombol **1-klik centang progres**, Mode Hafalan (Tahfidz), dan penanda batas **Target Khatam Harian** langsung di sela-sela ayat.
            - **Kompas Kiblat & Panduan Ibadah**: Penunjuk arah kiblat sensor kompas, panduan sholat, wudhu, dan dzikir.
            - **Personalisasi Lengkap**: Dukungan multi-bahasa, mode gelap/terang, 3 palet warna Islami, dan tur panduan fitur interaktif.

            ### Cara Pemasangan
            1. Unduh file **`JalanIslam-v1.0.0-release.apk`** di bagian **Assets** di bawah ini.
            2. Buka file APK pada perangkat Android (minimal Android 7.0 / API 24) dan izinkan pemasangan dari sumber tepercaya jika diminta.
          files: |
            app/build/outputs/apk/release/*.apk

